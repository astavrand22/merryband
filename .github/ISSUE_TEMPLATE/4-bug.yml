name: Bug
description: Something's broken or feels wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
